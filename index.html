<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FinScope is a self-contained financial calculator suite for investments, deposits, loans, retirement and business analysis.">
  <meta name="theme-color" content="#12382d">
  <title>FinScope | Financial Calculator Suite</title>
  <style>
:root {
  color-scheme: light;
  --canvas: #f2f5f3;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-soft: #edf2ef;
  --surface-tint: #e6f1ec;
  --ink: #17241f;
  --ink-soft: #52615a;
  --ink-faint: #738078;
  --line: #d8e0dc;
  --line-strong: #c1ccc6;
  --brand: #12624a;
  --brand-strong: #0b4e3a;
  --brand-soft: #d9ebe3;
  --blue: #2c6f8c;
  --amber: #b46c28;
  --red: #b84b4b;
  --sidebar: #12382d;
  --sidebar-ink: #f2faf6;
  --sidebar-muted: #a9c4b8;
  --shadow: 0 14px 40px rgba(20, 45, 35, 0.08);
  --radius: 8px;
  --font: Inter, Aptos, "Segoe UI", Arial, sans-serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #101613;
  --surface: #17201c;
  --surface-raised: #1b2621;
  --surface-soft: #202c27;
  --surface-tint: #18332a;
  --ink: #edf4f0;
  --ink-soft: #b5c2bb;
  --ink-faint: #87978f;
  --line: #334039;
  --line-strong: #48564f;
  --brand: #68c7a4;
  --brand-strong: #8bd7ba;
  --brand-soft: #214a3d;
  --blue: #69aaca;
  --amber: #dfa060;
  --red: #e07a7a;
  --sidebar: #0b211a;
  --sidebar-ink: #f2faf6;
  --sidebar-muted: #9bb7aa;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--canvas);
  scroll-behavior: smooth;
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: 0;
}

button,
input,
select {
  font: inherit;
  letter-spacing: 0;
}

button,
select,
input[type="range"] {
  cursor: pointer;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--brand) 32%, transparent);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 100;
  padding: 10px 14px;
  border-radius: 6px;
  background: var(--surface);
  color: var(--brand);
  font-weight: 700;
  transform: translateY(-150%);
}

.skip-link:focus {
  transform: translateY(0);
}

.icon-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

svg {
  display: block;
}

.app-shell {
  min-height: 100vh;
}

.global-header {
  position: sticky;
  top: 0;
  z-index: 40;
  height: 68px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(16px);
}

.global-header-inner {
  display: flex;
  width: 100%;
  max-width: 1540px;
  height: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 0 auto;
  padding: 0 clamp(18px, 3vw, 44px);
}

.global-header .brand-block {
  min-height: 0;
  padding: 0;
  border: 0;
  color: var(--ink);
}

.global-header .brand-subtitle {
  color: var(--ink-faint);
}

.global-header .brand-mark {
  border-color: #d89b43;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  display: flex;
  width: 264px;
  flex-direction: column;
  overflow-y: auto;
  background: var(--sidebar);
  color: var(--sidebar-ink);
}

.brand-block {
  display: flex;
  min-height: 86px;
  align-items: center;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.brand-mark {
  display: grid;
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  background: #e8b05e;
  color: #18382e;
}

.brand-mark svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.brand-mark.small {
  width: 32px;
  height: 32px;
  flex-basis: 32px;
}

.brand-mark.small svg {
  width: 18px;
  height: 18px;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;
  line-height: 1.15;
}

.brand-subtitle {
  margin-top: 3px;
  color: var(--sidebar-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sidebar-close {
  display: none;
  margin-left: auto;
  color: var(--sidebar-ink);
}

.tool-nav-wrap {
  position: sticky;
  top: 68px;
  z-index: 30;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.tool-nav {
  display: flex;
  width: 100%;
  max-width: 1540px;
  align-items: center;
  gap: 5px;
  margin: 0 auto;
  padding: 10px clamp(18px, 3vw, 44px);
  overflow-x: auto;
  scrollbar-width: thin;
  scroll-snap-type: x proximity;
}

.nav-group + .nav-group {
  margin-top: 22px;
}

.nav-group-label {
  margin: 0 10px 8px;
  color: var(--sidebar-muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.nav-button {
  display: flex;
  width: auto;
  min-height: 44px;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink-soft);
  text-align: left;
  scroll-snap-align: center;
}

.nav-button:hover {
  border-color: var(--line-strong);
  background: var(--surface-soft);
  color: var(--ink);
}

.nav-button.active {
  border-color: var(--brand);
  background: var(--brand);
  color: #ffffff;
}

.nav-icon {
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  place-items: center;
  border-radius: 6px;
  background: var(--surface-soft);
}

.active .nav-icon {
  background: #e8b05e;
  color: #18382e;
}

.nav-icon svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.nav-label {
  min-width: 0;
  overflow: hidden;
  font-size: 12px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.privacy-note {
  display: flex;
  gap: 10px;
  margin: 12px;
  padding: 13px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.04);
}

.privacy-note svg {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
  fill: none;
  stroke: #e8b05e;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.privacy-note strong,
.privacy-note span {
  display: block;
}

.privacy-note strong {
  font-size: 12px;
}

.privacy-note span {
  margin-top: 2px;
  color: var(--sidebar-muted);
  font-size: 11px;
}

.sidebar-scrim {
  display: none;
}

.workspace {
  width: 100%;
  min-height: 100vh;
  margin-left: 0;
}

.workspace-header {
  position: relative;
  z-index: 1;
  display: flex;
  width: 100%;
  max-width: 1540px;
  min-height: 112px;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  margin: 0 auto;
  padding: 19px clamp(22px, 3vw, 44px);
  border-bottom: 1px solid var(--line);
  background: var(--canvas);
}

.local-note {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  color: var(--ink-faint);
  font-size: 10px;
  font-weight: 650;
}

.local-note svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: var(--brand);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.mobile-brand {
  display: none;
}

.title-block {
  min-width: 0;
}

.eyebrow {
  margin-bottom: 3px;
  color: var(--brand);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(23px, 2vw, 30px);
  font-weight: 780;
  line-height: 1.16;
  letter-spacing: 0;
}

.title-block p {
  max-width: 600px;
  margin: 5px 0 0;
  color: var(--ink-soft);
  font-size: 13px;
}

.header-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
}

.currency-control {
  display: flex;
  min-height: 42px;
  align-items: center;
  gap: 7px;
  padding-left: 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
}

.currency-control span {
  color: var(--ink-faint);
  font-size: 11px;
  font-weight: 700;
}

.currency-control select {
  min-height: 40px;
  padding: 0 30px 0 2px;
  border: 0;
  background: var(--surface);
  color: var(--ink);
  font-size: 12px;
  font-weight: 750;
}

.icon-button {
  position: relative;
  display: grid;
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
}

.icon-button:hover {
  border-color: var(--line-strong);
  background: var(--surface-soft);
}

.icon-button svg,
.text-button svg,
.small-button svg,
.cashflow-remove svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.icon-button[data-tooltip]::after {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  z-index: 60;
  padding: 5px 7px;
  border-radius: 4px;
  background: var(--ink);
  color: var(--surface);
  content: attr(data-tooltip);
  font-size: 10px;
  font-weight: 650;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -3px);
  transition: opacity 120ms ease, transform 120ms ease;
  white-space: nowrap;
}

.icon-button[data-tooltip]:hover::after,
.icon-button[data-tooltip]:focus-visible::after {
  opacity: 1;
  transform: translate(-50%, 0);
}

.theme-sun {
  display: none;
}

html[data-theme="dark"] .theme-moon {
  display: none;
}

html[data-theme="dark"] .theme-sun {
  display: block;
}

.calculator-layout {
  display: grid;
  grid-template-columns: minmax(390px, 0.83fr) minmax(520px, 1.17fr);
  width: 100%;
  max-width: 1540px;
  min-height: calc(100vh - 166px);
  margin: 0 auto;
}

.input-pane,
.results-pane {
  min-width: 0;
  padding: 32px clamp(22px, 3vw, 44px) 36px;
}

.input-pane {
  border-right: 1px solid var(--line);
  background: var(--surface);
}

.results-pane {
  background: var(--canvas);
}

.pane-heading {
  display: flex;
  min-height: 45px;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.pane-heading h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 780;
}

.pane-heading p {
  margin: 3px 0 0;
  color: var(--ink-soft);
  font-size: 12px;
}

.live-status {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 750;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}

.input-section + .input-section {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.input-section-title {
  margin: 0 0 14px;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fields-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 16px;
}

.field {
  min-width: 0;
}

.field.wide {
  grid-column: 1 / -1;
}

.field-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}

.field-label-row label {
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
}

.field-help {
  color: var(--ink-faint);
  font-size: 10px;
  white-space: nowrap;
}

.number-shell {
  position: relative;
}

.number-shell input,
.select-shell select {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
}

.number-shell input {
  padding: 0 37px 0 13px;
}

.number-shell.prefix input {
  padding-left: 39px;
}

.input-affix {
  position: absolute;
  top: 50%;
  right: 12px;
  color: var(--ink-faint);
  font-size: 11px;
  font-weight: 750;
  pointer-events: none;
  transform: translateY(-50%);
}

.number-shell.prefix .input-affix {
  right: auto;
  left: 12px;
}

.select-shell select {
  padding: 0 12px;
}

.field input:focus,
.field select:focus {
  border-color: var(--brand);
}

.field input[aria-invalid="true"] {
  border-color: var(--red);
}

.range {
  width: 100%;
  height: 18px;
  margin: 8px 0 0;
  padding: 0;
  appearance: none;
  background: transparent;
}

.range::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 99px;
  background: var(--line);
}

.range::-webkit-slider-thumb {
  width: 16px;
  height: 16px;
  margin-top: -6px;
  border: 3px solid var(--surface);
  border-radius: 50%;
  appearance: none;
  background: var(--brand);
  box-shadow: 0 0 0 1px var(--brand);
}

.range::-moz-range-track {
  height: 4px;
  border-radius: 99px;
  background: var(--line);
}

.range::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 3px solid var(--surface);
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 0 1px var(--brand);
}

.assumption-note {
  display: flex;
  gap: 9px;
  margin-top: 24px;
  padding: 12px 13px;
  border-left: 3px solid var(--amber);
  background: color-mix(in srgb, var(--amber) 8%, var(--surface));
  color: var(--ink-soft);
  font-size: 11px;
}

.assumption-note svg {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  fill: none;
  stroke: var(--amber);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 1.8;
}

.result-kicker {
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.primary-result {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-top: 7px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
}

.primary-value {
  min-width: 0;
  color: var(--ink);
  font-size: clamp(30px, 4vw, 48px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1.03;
  overflow-wrap: anywhere;
}

.result-status {
  flex: 0 0 auto;
  padding: 6px 9px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-strong);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.result-status.warning {
  background: color-mix(in srgb, var(--amber) 16%, var(--surface));
  color: var(--amber);
}

.result-status.danger {
  background: color-mix(in srgb, var(--red) 14%, var(--surface));
  color: var(--red);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  margin: 20px 0 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--line);
}

.metric {
  min-width: 0;
  min-height: 82px;
  padding: 14px;
  background: var(--surface);
}

.metric-label {
  display: block;
  color: var(--ink-faint);
  font-size: 10px;
  font-weight: 720;
  line-height: 1.3;
  text-transform: uppercase;
}

.metric-value {
  display: block;
  margin-top: 7px;
  color: var(--ink);
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  font-weight: 760;
  overflow-wrap: anywhere;
}

.metric-value.positive {
  color: var(--brand);
}

.metric-value.negative {
  color: var(--red);
}

.chart-section,
.details-section,
.insight-section,
.scenario-section {
  margin-top: 26px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.section-heading h3 {
  margin: 0;
  font-size: 13px;
  font-weight: 780;
}

.section-heading span {
  color: var(--ink-faint);
  font-size: 10px;
}

.chart-frame {
  width: 100%;
  min-height: 260px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
}

.chart-frame svg {
  width: 100%;
  height: auto;
  aspect-ratio: 720 / 270;
}

.chart-grid-line {
  stroke: var(--line);
  stroke-width: 1;
}

.chart-axis-label {
  fill: var(--ink-faint);
  font-family: var(--font);
  font-size: 9px;
}

.chart-area {
  fill: color-mix(in srgb, var(--brand) 10%, transparent);
}

.chart-line-primary {
  fill: none;
  stroke: var(--brand);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 3;
}

.chart-line-secondary {
  fill: none;
  stroke: var(--blue);
  stroke-dasharray: 5 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2;
}

.chart-dot {
  fill: var(--surface);
  stroke: var(--brand);
  stroke-width: 2;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 10px 14px 12px;
  border-top: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 10px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-line {
  width: 18px;
  height: 3px;
  border-radius: 2px;
  background: var(--brand);
}

.legend-line.secondary {
  height: 2px;
  background: var(--blue);
}

.stacked-bar {
  display: flex;
  width: 100%;
  height: 12px;
  overflow: hidden;
  border-radius: 4px;
  background: var(--surface-soft);
}

.bar-segment {
  min-width: 0;
  height: 100%;
}

.bar-segment.brand {
  background: var(--brand);
}

.bar-segment.blue {
  background: var(--blue);
}

.bar-segment.amber {
  background: var(--amber);
}

.bar-segment.red {
  background: var(--red);
}

.allocation-legend {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px 16px;
  margin-top: 13px;
}

.allocation-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--ink-soft);
  font-size: 11px;
}

.allocation-name {
  display: inline-flex;
  min-width: 0;
  align-items: center;
  gap: 7px;
}

.allocation-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;

.bar-space {

  justify-content: center;

.cash-bar {

  background: var(--blue);

.component-row:nth-child(3) .component-fill {

        <div class="title-block">
          <div class="eyebrow" id="toolGroup">Investing</div>
          <h1 id="toolTitle">SIP Calculator</h1>
          <p id="toolDescription">Calculate the future value of monthly investments.</p>
        </div>
        <div class="local-note">
          <svg aria-hidden="true"><use href="#icon-shield-check"></use></svg>
          <span>Saved privately in your browser</span>
        </div>
      </header>

      <section class="calculator-layout" id="calculatorView" aria-live="polite"></section>

      <footer class="app-footer">
        <p>Educational estimates only. Taxes, returns, rates and regulations can change.</p>
        <div class="footer-actions">
          <button class="text-button" id="copyButton">
            <svg aria-hidden="true"><use href="#icon-copy"></use></svg>
            Copy summary
          </button>
          <button class="text-button" id="exportButton">
            <svg aria-hidden="true"><use href="#icon-download"></use></svg>
            Export CSV
          </button>
          <button class="text-button" id="printButton">
            <svg aria-hidden="true"><use href="#icon-printer"></use></svg>
            Print report
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(function (root, factory) {
  var engine = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = engine;
  }
  root.FinanceEngine = engine;
}(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  function number(value, fallback) {
    var parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : (fallback || 0);
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function monthlyRate(annualPercent) {
    var annual = number(annualPercent) / 100;
    if (annual <= -1) {
      return -1;
    }
    return Math.pow(1 + annual, 1 / 12) - 1;
  }

  function simulateRecurring(options) {
    var initial = Math.max(0, number(options.initial));
    var contribution = Math.max(0, number(options.monthly));
    var annualStep = number(options.annualStep) / 100;
    var years = Math.max(0, Math.floor(number(options.years)));
    var rate = monthlyRate(number(options.annualReturn) - number(options.fees));
    var balance = initial;
    var contributed = initial;
    var rows = [{
      year: 0,
      balance: balance,
      contributed: contributed,
      gains: 0
    }];

    for (var month = 1; month <= years * 12; month += 1) {
      balance = (balance + contribution) * (1 + rate);
      contributed += contribution;

      if (month % 12 === 0) {
        rows.push({
          year: month / 12,
          balance: balance,
          contributed: contributed,
          gains: balance - contributed
        });
        contribution *= 1 + annualStep;
      }
    }

    return {
      ending: balance,
      contributed: contributed,
      gains: balance - contributed,
      rows: rows
    };
  }

  function investment(values) {
    var years = Math.max(1, Math.floor(number(values.years, 1)));
    var base = simulateRecurring({
      initial: values.initial,
      monthly: values.monthly,
      annualStep: values.annualStep,
      annualReturn: values.returnRate,
      fees: values.fees,
      years: years
    });
    var gross = simulateRecurring({
      initial: values.initial,
      monthly: values.monthly,
      annualStep: values.annualStep,
      annualReturn: values.returnRate,
      fees: 0,
      years: years
    });
    var inflation = number(values.inflation) / 100;
    var realValue = base.ending / Math.pow(1 + inflation, years);

    return {
      ending: base.ending,
      contributed: base.contributed,
      gains: base.gains,
      realValue: realValue,
      feeDrag: Math.max(0, gross.ending - base.ending),
      netAnnualReturn: number(values.returnRate) - number(values.fees),
      rows: base.rows
    };
  }

  function sip(values) {
    var years = Math.max(1, Math.floor(number(values.years, 1)));
    var projection = simulateRecurring({
      initial: 0,
      monthly: values.monthly,
      annualStep: values.annualStep,
      annualReturn: values.returnRate,
      fees: values.fees,
      years: years
    });
    var realValue = projection.ending / Math.pow(1 + number(values.inflation) / 100, years);
    return {
      ending: projection.ending,
      contributed: projection.contributed,
      gains: projection.gains,
      realValue: realValue,
      rows: projection.rows,
      annualStep: number(values.annualStep),
      netAnnualReturn: number(values.returnRate) - number(values.fees)
    };
  }

  function lumpsum(values) {
    var principal = Math.max(0, number(values.principal));
    var years = Math.max(0, number(values.years));
    var netReturn = number(values.returnRate) - number(values.fees);
    var annualRate = netReturn / 100;
    var ending = principal * Math.pow(1 + annualRate, years);
    var realValue = ending / Math.pow(1 + number(values.inflation) / 100, years);
    var rows = [];
    for (var year = 0; year <= Math.floor(years); year += 1) {
      var balance = principal * Math.pow(1 + annualRate, year);
      rows.push({
        year: year,
        balance: balance,
        principal: principal,
        realValue: balance / Math.pow(1 + number(values.inflation) / 100, year)
      });
    }
    if (rows.length === 0 || rows[rows.length - 1].year !== years) {
      rows.push({ year: years, balance: ending, principal: principal, realValue: realValue });
    }
    return {
      ending: ending,
      principal: principal,
      gains: ending - principal,
      realValue: realValue,
      netAnnualReturn: netReturn,
      rows: rows
    };
  }

  function recurringDeposit(values) {
    var years = Math.max(0, number(values.years));
    var months = Math.max(1, Math.round(years * 12));
    var monthlyDeposit = Math.max(0, number(values.monthlyDeposit));
    var rate = number(values.rate) / 100 / 12;
    var balance = 0;
    var deposited = 0;
    var rows = [{ year: 0, balance: 0, deposited: 0 }];
    for (var month = 1; month <= months; month += 1) {
      balance = (balance + monthlyDeposit) * (1 + rate);
      deposited += monthlyDeposit;
      if (month % 12 === 0 || month === months) {
        rows.push({
          year: month / 12,
          balance: balance,
          deposited: deposited
        });
      }
    }
    var interest = balance - deposited;
    var tax = Math.max(0, interest * number(values.taxRate) / 100);
    return {
      maturity: balance - tax,
      grossMaturity: balance,
      deposited: deposited,
      interest: interest,
      tax: tax,
      rows: rows.map(function (row) {
        var rowInterest = Math.max(0, row.balance - row.deposited);
        return {
          year: row.year,
          balance: row.balance - rowInterest * number(values.taxRate) / 100,
          deposited: row.deposited
        };
      })
    };
  }

  function nps(values) {
    var currentAge = Math.max(18, Math.floor(number(values.currentAge, 30)));
    var retirementAge = Math.max(currentAge + 1, Math.floor(number(values.retirementAge, 60)));
    var years = retirementAge - currentAge;
    var projection = simulateRecurring({
      initial: values.currentCorpus,
      monthly: values.monthlyContribution,
      annualStep: values.annualStep,
      annualReturn: values.returnRate,
      fees: 0,
      years: years
    });
    var annuityPercent = clamp(number(values.annuityPercent), 0, 100) / 100;
    var annuityCorpus = projection.ending * annuityPercent;
    var lumpSum = projection.ending - annuityCorpus;
    var monthlyPension = annuityCorpus * number(values.annuityRate) / 100 / 12;
    return {
      totalCorpus: projection.ending,
      contributed: projection.contributed,
      gains: projection.gains,
      annuityCorpus: annuityCorpus,
      lumpSum: lumpSum,
      monthlyPension: monthlyPension,
      years: years,
      rows: projection.rows
    };
  }

  function cagr(values) {
    var initial = number(values.initial);
    var finalValue = number(values.finalValue);
    var years = number(values.years);
    var valid = initial > 0 && finalValue >= 0 && years > 0;
    var annualRate = valid ? (Math.pow(finalValue / initial, 1 / years) - 1) * 100 : null;
    var totalReturn = initial > 0 ? (finalValue / initial - 1) * 100 : null;
    var rows = [];
    if (valid) {
      for (var year = 0; year <= Math.floor(years); year += 1) {
        rows.push({
          year: year,
          balance: initial * Math.pow(1 + annualRate / 100, year),
          initial: initial
        });
      }
      if (rows[rows.length - 1].year !== years) {
        rows.push({ year: years, balance: finalValue, initial: initial });
      }
    }
    return {
      cagr: annualRate,
      totalReturn: totalReturn,
      absoluteGain: finalValue - initial,
      valid: valid,
      rows: rows
    };
  }

  function loanPayment(principal, annualRate, months) {
    var p = Math.max(0, number(principal));
    var n = Math.max(1, Math.floor(number(months, 1)));
    var rate = number(annualRate) / 100 / 12;
    if (Math.abs(rate) < 1e-12) {
      return p / n;
    }
    var factor = Math.pow(1 + rate, n);
    return p * rate * factor / (factor - 1);
  }

  function buildLoanSchedule(principal, annualRate, scheduledPayment, extraMonthly, oneTimePayment, oneTimeMonth, maximumMonths) {
    var balance = Math.max(0, number(principal));
    var monthly = number(annualRate) / 100 / 12;
    var scheduled = Math.max(0, number(scheduledPayment));
    var extra = Math.max(0, number(extraMonthly));
    var oneTime = Math.max(0, number(oneTimePayment));
    var oneMonth = Math.max(1, Math.floor(number(oneTimeMonth, 12)));
    var maxMonths = Math.max(1, Math.floor(number(maximumMonths, 1200)));
    var totalInterest = 0;
    var totalPaid = 0;
    var rows = [];

    for (var month = 1; month <= maxMonths && balance > 0.005; month += 1) {
      var startingBalance = balance;
      var interest = startingBalance * monthly;
      var plannedPayment = scheduled + extra + (month === oneMonth ? oneTime : 0);
      var actualPayment = Math.min(startingBalance + interest, plannedPayment);
      var principalPaid = Math.max(0, actualPayment - interest);

      if (principalPaid <= 0 && startingBalance > 0) {
        break;
      }

      balance = Math.max(0, startingBalance - principalPaid);
      totalInterest += interest;
      totalPaid += actualPayment;
      rows.push({
        month: month,
        startingBalance: startingBalance,
        payment: actualPayment,
        principal: principalPaid,
        interest: interest,
        endingBalance: balance
      });
    }

    return {
      rows: rows,
      totalInterest: totalInterest,
      totalPaid: totalPaid,
      payoffMonths: rows.length,
      remainingBalance: balance
    };
  }

  function loan(values) {
    var principal = Math.max(0, number(values.principal));
    var years = Math.max(1, number(values.years, 1));
    var originalMonths = Math.max(1, Math.round(years * 12));
    var payment = loanPayment(principal, values.apr, originalMonths);
    var baseline = buildLoanSchedule(principal, values.apr, payment, 0, 0, 1, originalMonths + 2);
    var accelerated = buildLoanSchedule(
      principal,
      values.apr,
      payment,
      values.extraMonthly,
      values.oneTimePayment,
      values.oneTimeMonth,
      originalMonths + 2
    );

    return {
      monthlyPayment: payment,
      totalInterest: accelerated.totalInterest,
      totalPaid: accelerated.totalPaid,
      payoffMonths: accelerated.payoffMonths,
      interestSaved: Math.max(0, baseline.totalInterest - accelerated.totalInterest),
      monthsSaved: Math.max(0, baseline.payoffMonths - accelerated.payoffMonths),
      schedule: accelerated.rows,
      baselineSchedule: baseline.rows,
      remainingBalance: accelerated.remainingBalance
    };
  }

  function projectGoal(values, monthlyAmount) {
    return simulateRecurring({
      initial: values.currentSavings,
      monthly: monthlyAmount,
      annualStep: values.annualStep,
      annualReturn: values.returnRate,
      fees: 0,
      years: values.years
    });
  }

  function solveMonthly(target, projector) {
    if (projector(0).ending >= target) {
      return 0;
    }
    var low = 0;
    var high = 100;
    var guard = 0;
    while (projector(high).ending < target && guard < 80) {
      high *= 2;
      guard += 1;
    }
    for (var i = 0; i < 80; i += 1) {
      var mid = (low + high) / 2;
      if (projector(mid).ending >= target) {
        high = mid;
      } else {
        low = mid;
      }
    }
    return high;
  }

  function goal(values) {
    var years = Math.max(1, Math.floor(number(values.years, 1)));
    var target = Math.max(0, number(values.currentCost)) * Math.pow(1 + number(values.inflation) / 100, years);
    var currentMonthly = Math.max(0, number(values.monthlySaving));
    var projector = function (monthly) {
      var next = {};
      Object.keys(values).forEach(function (key) {
        next[key] = values[key];
      });
      next.years = years;
      return projectGoal(next, monthly);
    };
    var projection = projector(currentMonthly);
    var requiredMonthly = solveMonthly(target, projector);

    return {
      futureTarget: target,
      projected: projection.ending,
      contributed: projection.contributed,
      gains: projection.gains,
      requiredMonthly: requiredMonthly,
      monthlyGap: Math.max(0, requiredMonthly - currentMonthly),
      fundingPercent: target > 0 ? projection.ending / target * 100 : 100,
      rows: projection.rows
    };
  }

  function growingAnnuityPresentValue(firstAnnualPayment, returnRate, growthRate, years) {
    var payment = Math.max(0, number(firstAnnualPayment));
    var r = number(returnRate) / 100;
    var g = number(growthRate) / 100;
    var n = Math.max(0, Math.floor(number(years)));
    if (n === 0) {
      return 0;
    }
    if (Math.abs(r - g) < 1e-9) {
      return payment * n / (1 + r);
    }
    return payment / (r - g) * (1 - Math.pow((1 + g) / (1 + r), n));
  }

  function retirement(values) {
    var currentAge = Math.floor(number(values.currentAge));
    var retirementAge = Math.max(currentAge + 1, Math.floor(number(values.retirementAge)));
    var lifeExpectancy = Math.max(retirementAge + 1, Math.floor(number(values.lifeExpectancy)));
    var yearsToRetirement = retirementAge - currentAge;
    var yearsInRetirement = lifeExpectancy - retirementAge;
    var inflation = number(values.inflation);
    var retirementMonthlyExpense = Math.max(0, number(values.monthlyExpense)) * Math.pow(1 + inflation / 100, yearsToRetirement);
    var target = growingAnnuityPresentValue(
      retirementMonthlyExpense * 12,
      values.postReturn,
      inflation,
      yearsInRetirement
    );

    var baseOptions = {
      initial: values.currentSavings,
      annualStep: values.annualStep,
      annualReturn: values.preReturn,
      fees: 0,
      years: yearsToRetirement
    };
    var projector = function (monthly) {
      baseOptions.monthly = monthly;
      return simulateRecurring(baseOptions);
    };
    var projection = projector(Math.max(0, number(values.monthlyContribution)));
    var requiredMonthly = solveMonthly(target, projector);

    return {
      targetCorpus: target,
      projectedCorpus: projection.ending,
      shortfall: Math.max(0, target - projection.ending),
      surplus: Math.max(0, projection.ending - target),
      requiredMonthly: requiredMonthly,
      monthlyGap: Math.max(0, requiredMonthly - number(values.monthlyContribution)),
      retirementMonthlyExpense: retirementMonthlyExpense,
      fundedPercent: target > 0 ? projection.ending / target * 100 : 100,
      yearsToRetirement: yearsToRetirement,
      yearsInRetirement: yearsInRetirement,
      rows: projection.rows
    };
  }

  function deposit(values) {
    var principal = Math.max(0, number(values.principal));
    var annual = number(values.rate) / 100;
    var years = Math.max(0, number(values.years));
    var frequency = Math.max(1, Math.floor(number(values.compounding, 4)));
    var periods = frequency * years;
    var grossMaturity = principal * Math.pow(1 + annual / frequency, periods);
    var grossInterest = grossMaturity - principal;
    var tax = Math.max(0, grossInterest * number(values.taxRate) / 100);
    var netMaturity = grossMaturity - tax;
    var realValue = netMaturity / Math.pow(1 + number(values.inflation) / 100, years);
    var annualizedNetYield = years > 0 && principal > 0
      ? (Math.pow(netMaturity / principal, 1 / years) - 1) * 100
      : 0;
    var rows = [];
    for (var year = 0; year <= Math.floor(years); year += 1) {
      var grossAtYear = principal * Math.pow(1 + annual / frequency, frequency * year);
      var taxAtYear = Math.max(0, (grossAtYear - principal) * number(values.taxRate) / 100);
      var netAtYear = grossAtYear - taxAtYear;
      rows.push({
        year: year,
        balance: netAtYear,
        realValue: netAtYear / Math.pow(1 + number(values.inflation) / 100, year)
      });
    }
    if (rows.length === 0 || rows[rows.length - 1].year !== years) {
      rows.push({ year: years, balance: netMaturity, realValue: realValue });
    }

    return {
      grossMaturity: grossMaturity,
      grossInterest: grossInterest,
      tax: tax,
      netMaturity: netMaturity,
      realValue: realValue,
      annualizedNetYield: annualizedNetYield,
      effectiveAnnualYield: (Math.pow(1 + annual / frequency, frequency) - 1) * 100,
      rows: rows
    };
  }

  function wacc(values) {
    var debt = Math.max(0, number(values.debtValue));
    var equity = Math.max(0, number(values.equityValue));
    var preferred = Math.max(0, number(values.preferredValue));
    var total = debt + equity + preferred;
    var afterTaxDebt = number(values.debtRate) * (1 - number(values.taxRate) / 100);
    var equityCost = number(values.riskFree) + number(values.beta) * (number(values.marketReturn) - number(values.riskFree));
    var preferredCost = number(values.preferredRate);
    var debtWeight = total ? debt / total : 0;
    var equityWeight = total ? equity / total : 0;
    var preferredWeight = total ? preferred / total : 0;
    var debtContribution = debtWeight * afterTaxDebt;
    var equityContribution = equityWeight * equityCost;
    var preferredContribution = preferredWeight * preferredCost;

    return {
      totalCapital: total,
      wacc: debtContribution + equityContribution + preferredContribution,
      afterTaxDebt: afterTaxDebt,
      equityCost: equityCost,
      preferredCost: preferredCost,
      weights: {
        debt: debtWeight,
        equity: equityWeight,
        preferred: preferredWeight
      },
      contributions: {
        debt: debtContribution,
        equity: equityContribution,
        preferred: preferredContribution
      }
    };
  }

  function npvAtRate(cashFlows, rate) {
    return cashFlows.reduce(function (sum, cashFlow, index) {
      return sum + number(cashFlow) / Math.pow(1 + rate, index);
    }, 0);
  }

  function findIrr(cashFlows) {
    var flows = cashFlows.map(function (value) { return number(value); });
    var hasPositive = flows.some(function (value) { return value > 0; });
    var hasNegative = flows.some(function (value) { return value < 0; });
    if (!hasPositive || !hasNegative) {
      return null;
    }

    var previousRate = -0.9999;
    var previousValue = npvAtRate(flows, previousRate);
    var low = null;
    var high = null;
    for (var i = 1; i <= 6000; i += 1) {
      var rate = -0.9999 + 10.9999 * (i / 6000);
      var value = npvAtRate(flows, rate);
      if (value === 0 || previousValue * value < 0) {
        low = previousRate;
        high = rate;
        break;
      }
      previousRate = rate;
      previousValue = value;
    }
    if (low === null) {
      return null;
    }
    for (var step = 0; step < 120; step += 1) {
      var middle = (low + high) / 2;
      var lowValue = npvAtRate(flows, low);
      var middleValue = npvAtRate(flows, middle);
      if (Math.abs(middleValue) < 1e-10) {
        return middle;
      }
      if (lowValue * middleValue <= 0) {
        high = middle;
      } else {
        low = middle;
      }
    }
    return (low + high) / 2;
  }

  function paybackPeriod(cashFlows, discountedRate) {
    var cumulative = number(cashFlows[0]);
    if (cumulative >= 0) {
      return 0;
    }
    for (var period = 1; period < cashFlows.length; period += 1) {
      var amount = number(cashFlows[period]);
      if (discountedRate !== undefined) {
        amount /= Math.pow(1 + discountedRate, period);
      }
      var before = cumulative;
      cumulative += amount;
      if (cumulative >= 0 && amount > 0) {
        return (period - 1) + (-before / amount);
      }
    }
    return null;
  }

  function project(values) {
    var cashFlows = (values.cashFlows || []).map(function (value) { return number(value); });
    var discountRate = number(values.discountRate) / 100;
    var netPresentValue = npvAtRate(cashFlows, discountRate);
    var irr = findIrr(cashFlows);
    var initialOutlay = Math.abs(Math.min(0, cashFlows[0] || 0));
    var presentValueInflows = cashFlows.slice(1).reduce(function (sum, flow, index) {
      return sum + Math.max(0, flow) / Math.pow(1 + discountRate, index + 1);
    }, 0);

    return {
      npv: netPresentValue,
      irr: irr === null ? null : irr * 100,
      profitabilityIndex: initialOutlay > 0 ? presentValueInflows / initialOutlay : null,
      payback: paybackPeriod(cashFlows),
      discountedPayback: paybackPeriod(cashFlows, discountRate),
      cashFlows: cashFlows,
      cumulative: cashFlows.map(function (_, index) {
        return cashFlows.slice(0, index + 1).reduce(function (sum, value) { return sum + value; }, 0);
      })
    };
  }

  function moneyHealth(values) {
    var income = Math.max(0, number(values.monthlyIncome));
    var essentials = Math.max(0, number(values.essentials));
    var lifestyle = Math.max(0, number(values.lifestyle));
    var debtPayments = Math.max(0, number(values.debtPayments));
    var monthlySavings = Math.max(0, number(values.monthlySavings));
    var liquidSavings = Math.max(0, number(values.liquidSavings));
    var totalDebt = Math.max(0, number(values.totalDebt));
    var committed = essentials + lifestyle + debtPayments + monthlySavings;
    var balance = income - committed;
    var savingsRate = income ? monthlySavings / income * 100 : 0;
    var debtToIncome = income ? debtPayments / income * 100 : 0;
    var essentialBurn = essentials + debtPayments;
    var emergencyMonths = essentialBurn ? liquidSavings / essentialBurn : 0;
    var emergencyTarget = essentialBurn * 6;
    var debtPayoffMonths = debtPayments > 0
      ? totalDebt / debtPayments
      : (totalDebt > 0 ? null : 0);

    var savingsScore = clamp(savingsRate / 20 * 30, 0, 30);
    var debtScore = clamp((45 - debtToIncome) / 45 * 25, 0, 25);
    var reserveScore = clamp(emergencyMonths / 6 * 25, 0, 25);
    var balanceScore = balance >= 0
      ? 20
      : clamp(20 + (income ? balance / income * 100 : -20), 0, 20);
    var score = Math.round(savingsScore + debtScore + reserveScore + balanceScore);
    var status = score >= 80 ? "Strong" : score >= 65 ? "Stable" : score >= 45 ? "Needs attention" : "At risk";

    return {
      score: score,
      status: status,
      balance: balance,
      savingsRate: savingsRate,
      debtToIncome: debtToIncome,
      emergencyMonths: emergencyMonths,
      emergencyTarget: emergencyTarget,
      emergencyGap: Math.max(0, emergencyTarget - liquidSavings),
      annualSavings: monthlySavings * 12,
      totalDebt: totalDebt,
      debtPayoffMonths: debtPayoffMonths,
      allocation: {
        essentials: essentials,
        lifestyle: lifestyle,
        debt: debtPayments,
        savings: monthlySavings,
        unallocated: Math.max(0, balance)
      }
    };
  }

  return {
    investment: investment,
    sip: sip,
    lumpsum: lumpsum,
    recurringDeposit: recurringDeposit,
    nps: nps,
    cagr: cagr,
    loan: loan,
    loanPayment: loanPayment,
    goal: goal,
    retirement: retirement,
    deposit: deposit,
    wacc: wacc,
    project: project,
    moneyHealth: moneyHealth,
    npvAtRate: npvAtRate,
    findIrr: findIrr,
    simulateRecurring: simulateRecurring,

  };

    if (tool.id === "project") {
      html.push(renderCashFlowEditor(values));
    }

    html.push("</form>");
    html.push("<div class=\"assumption-note\">" + icon("alert") + "<span>" + escapeHtml(tool.note) + "</span></div>");

  }

  function metric(label, value, tone) {

  function insight(title, copy, tone) {

  function resultHeader(kicker, value, status, statusTone) {
    return [
      "<div class=\"result-kicker\">" + escapeHtml(kicker) + "</div>",
      "<div class=\"primary-result\">",

  function sectionHeading(title, meta) {
    return "<div class=\"section-heading\"><h3>" + escapeHtml(title) + "</h3>" + (meta ? "<span>" + escapeHtml(meta) + "</span>" : "") + "</div>";
  }

  function stackedBar(parts) {
    var total = parts.reduce(function (sum, part) { return sum + Math.max(0, part.value); }, 0);
    var bars = [];
    var legend = [];
    parts.forEach(function (part) {
      var width = total ? Math.max(0, part.value) / total * 100 : 0;
      bars.push("<span class=\"bar-segment " + part.color + "\" style=\"width:" + width.toFixed(3) + "%\"></span>");
      legend.push(
        "<div class=\"allocation-row\"><span class=\"allocation-name\"><span class=\"allocation-dot " + part.color + "\" style=\"background:var(--" + part.color + ")\"></span>" +
        escapeHtml(part.label) + "</span><strong>" + part.display + "</strong></div>"
      );
    });
    return "<div class=\"stacked-bar\" aria-label=\"Allocation breakdown\">" + bars.join("") + "</div><div class=\"allocation-legend\">" + legend.join("") + "</div>";
  }

  function chartPointPath(rows, key, width, height, margin, maxValue) {
    if (!rows.length) {
      return "";
    }
    return rows.map(function (row, index) {
      var x = margin.left + (rows.length === 1 ? 0 : index / (rows.length - 1) * (width - margin.left - margin.right));
      var y = margin.top + (height - margin.top - margin.bottom) * (1 - Math.max(0, Number(row[key]) || 0) / maxValue);
      return (index === 0 ? "M" : "L") + x.toFixed(2) + " " + y.toFixed(2);
    }).join(" ");
  }

  function lineChart(rows, primaryKey, secondaryKey, primaryLabel, secondaryLabel, ariaLabel) {
    var width = 720;
    var height = 270;
    var margin = { top: 18, right: 18, bottom: 36, left: 72 };
    var values = [];
    rows.forEach(function (row) {
      values.push(Math.max(0, Number(row[primaryKey]) || 0));
      if (secondaryKey) {
        values.push(Math.max(0, Number(row[secondaryKey]) || 0));
      }
    });
    var maxValue = Math.max.apply(Math, values.concat([1])) * 1.08;
    var primaryPath = chartPointPath(rows, primaryKey, width, height, margin, maxValue);
    var secondaryPath = secondaryKey ? chartPointPath(rows, secondaryKey, width, height, margin, maxValue) : "";
    var baselineY = height - margin.bottom;
    var lastX = width - margin.right;
    var areaPath = primaryPath ? primaryPath + " L" + lastX + " " + baselineY + " L" + margin.left + " " + baselineY + " Z" : "";
    var svg = [
      "<div class=\"chart-frame\">",
      "<svg viewBox=\"0 0 " + width + " " + height + "\" role=\"img\" aria-label=\"" + escapeHtml(ariaLabel) + "\">"
    ];

    for (var tick = 0; tick <= 4; tick += 1) {
      var y = margin.top + (height - margin.top - margin.bottom) * tick / 4;
      var tickValue = maxValue * (1 - tick / 4);
      svg.push("<line class=\"chart-grid-line\" x1=\"" + margin.left + "\" x2=\"" + (width - margin.right) + "\" y1=\"" + y + "\" y2=\"" + y + "\"></line>");
      svg.push("<text class=\"chart-axis-label\" x=\"" + (margin.left - 8) + "\" y=\"" + (y + 3) + "\" text-anchor=\"end\">" + escapeHtml(money(tickValue, true)) + "</text>");
    }

    var labelEvery = Math.max(1, Math.ceil(rows.length / 6));
    rows.forEach(function (row, index) {
      if (index % labelEvery !== 0 && index !== rows.length - 1) {
        return;
      }
      var x = margin.left + (rows.length === 1 ? 0 : index / (rows.length - 1) * (width - margin.left - margin.right));
      var label = row.label !== undefined ? row.label : (row.year !== undefined ? "Y" + row.year : index);
      svg.push("<text class=\"chart-axis-label\" x=\"" + x + "\" y=\"" + (height - 13) + "\" text-anchor=\"middle\">" + escapeHtml(label) + "</text>");
    });

    svg.push("<path class=\"chart-area\" d=\"" + areaPath + "\"></path>");
    svg.push("<path class=\"chart-line-primary\" d=\"" + primaryPath + "\"></path>");
    if (secondaryPath) {
      svg.push("<path class=\"chart-line-secondary\" d=\"" + secondaryPath + "\"></path>");
    }
    if (rows.length) {
      var last = rows.length - 1;
      var dotX = margin.left + (rows.length === 1 ? 0 : last / (rows.length - 1) * (width - margin.left - margin.right));
      var dotY = margin.top + (height - margin.top - margin.bottom) * (1 - Math.max(0, Number(rows[last][primaryKey]) || 0) / maxValue);
      svg.push("<circle class=\"chart-dot\" cx=\"" + dotX + "\" cy=\"" + dotY + "\" r=\"4\"></circle>");
    }
    svg.push("</svg>");
    svg.push("<div class=\"chart-legend\"><span class=\"legend-item\"><span class=\"legend-line\"></span>" + escapeHtml(primaryLabel) + "</span>");
    if (secondaryKey) {
      svg.push("<span class=\"legend-item\"><span class=\"legend-line secondary\"></span>" + escapeHtml(secondaryLabel) + "</span>");
    }
    svg.push("</div></div>");
    return svg.join("");
  }

  function formulaBox(title, formula, copy) {

  function sampleLoanRows(values, result) {
    var rows = [{ label: "Start", balance: Number(values.principal), baseline: Number(values.principal) }];
    var totalYears = Math.ceil(result.baselineSchedule.length / 12);
    for (var year = 1; year <= totalYears; year += 1) {
      var index = year * 12 - 1;
      var acceleratedRow = result.schedule[Math.min(index, result.schedule.length - 1)];
      var baselineRow = result.baselineSchedule[Math.min(index, result.baselineSchedule.length - 1)];
      rows.push({
        label: "Y" + year,
        balance: index >= result.schedule.length ? 0 : acceleratedRow.endingBalance,
        baseline: baselineRow ? baselineRow.endingBalance : 0
      });
    }
    return rows;
  }

  function loanTable(result) {
    var displayRows = result.schedule.length <= 25
      ? result.schedule
      : result.schedule.slice(0, 24).concat([result.schedule[result.schedule.length - 1]]);
    var body = displayRows.map(function (row, index) {
      var separator = index === 24 && result.schedule.length > 25
        ? "<tr><td colspan=\"6\" style=\"text-align:center;color:var(--ink-faint)\">... remaining months included in CSV export ...</td></tr>"
        : "";
      return separator +
        "<tr><td>" + row.month + "</td><td>" + money(row.startingBalance) + "</td><td>" + money(row.payment) + "</td><td>" + money(row.principal) + "</td><td>" + money(row.interest) + "</td><td>" + money(row.endingBalance) + "</td></tr>";
    }).join("");
    return [
      "<div class=\"table-wrap\">",
      "<table class=\"data-table\"><caption>Loan amortization schedule</caption>",
      "<thead><tr><th>Month</th><th>Opening</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>",
      "<tbody>" + body + "</tbody></table></div>"
    ].join("");
  }

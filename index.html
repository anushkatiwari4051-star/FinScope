      ]),
      "</div>",
      "<div class=\"insight-section\">",
      sectionHeading("Deposit notes", ""),
      "<div class=\"insight-list\">",
      insight("Effective yield", compoundingLabel(values.compounding) + " compounding lifts the quoted " + percent(values.rate) + " rate to " + percent(result.effectiveAnnualYield) + " before tax.", ""),
      insight("Real return", result.realValue >= Number(values.principal) ? "The deposit preserves purchasing power under the entered inflation rate." : "Inflation is higher than the modeled after-tax growth, reducing purchasing power.", result.realValue >= Number(values.principal) ? "" : "warning"),
      "</div>",
      formulaBox("Compound deposit", "Maturity = principal * (1 + annual rate / frequency)^(frequency * years)", "Tax is deducted from total modeled interest at maturity."),
      "</div>"
    ].join("");
  }

  function renderRdResults(values) {
    var result = Engine.recurringDeposit(values);
    lastResult = result;
    return [
      resultHeader("RD maturity value", money(result.maturity), "After estimated tax", ""),
      "<div class=\"metrics-grid\">",
      metric("Total deposited", money(result.deposited), ""),
      metric("Interest earned", money(result.interest), "positive"),
      metric("Estimated tax", money(result.tax), result.tax > 0 ? "negative" : ""),
      "</div>",
      "<div class=\"chart-section\">",
      sectionHeading("Deposit growth", "Annual view"),
      lineChart(result.rows, "balance", "deposited", "Maturity value", "Deposits made", "Recurring deposit balance and total deposits by year"),
      "</div>",
      "<div class=\"details-section\">",
      sectionHeading("Maturity breakdown", ""),
      stackedBar([
        { label: "Deposits", value: result.deposited, display: money(result.deposited), color: "blue" },
        { label: "Interest after tax", value: Math.max(0, result.interest - result.tax), display: money(result.interest - result.tax), color: "brand" },
        { label: "Tax", value: result.tax, display: money(result.tax), color: "amber" }
      ]),
      "</div>",
      "<div class=\"insight-section\">",
      sectionHeading("RD notes", ""),
      "<div class=\"insight-list\">",
      insight("Deposit schedule", plainNumber(result.rows[result.rows.length - 1].year * 12, 0) + " monthly deposits contribute " + money(result.deposited) + ".", ""),
      insight("Interest share", "Interest adds " + percent(result.maturity ? (result.interest - result.tax) / result.maturity * 100 : 0) + " of the after-tax maturity value.", ""),
      "</div>",
      formulaBox("Recurring deposit", "Each monthly deposit earns interest for its remaining months.", "This model compounds monthly and deducts entered tax from total interest at maturity."),
      "</div>"
    ].join("");
  }

  function componentRow(name, weight, cost, contribution) {
    return "<div class=\"component-row\"><span class=\"component-name\">" + escapeHtml(name) + "</span><span class=\"component-track\"><span class=\"component-fill\" style=\"width:" + Math.max(0, Math.min(100, weight * 100)) + "%;display:block\"></span></span><span class=\"component-number\">" + percent(weight * 100, 0) + "</span><span class=\"component-number\">" + percent(contribution, 2) + "</span></div>";
  }

  function renderWaccResults(values) {
    var result = Engine.wacc(values);
    var lowBeta = Engine.wacc(Object.assign({}, values, { beta: Math.max(0, Number(values.beta) - 0.2) }));
    var highBeta = Engine.wacc(Object.assign({}, values, { beta: Number(values.beta) + 0.2 }));
    var table = [
      "<div class=\"table-wrap\"><table class=\"data-table\"><caption>WACC component contributions</caption>",
      "<thead><tr><th>Source</th><th>Market value</th><th>Weight</th><th>Component cost</th><th>WACC contribution</th></tr></thead><tbody>",
      "<tr><td>Debt</td><td>" + money(values.debtValue) + "</td><td>" + percent(result.weights.debt * 100, 1) + "</td><td>" + percent(result.afterTaxDebt, 2) + "</td><td>" + percent(result.contributions.debt, 2) + "</td></tr>",
      "<tr><td>Equity</td><td>" + money(values.equityValue) + "</td><td>" + percent(result.weights.equity * 100, 1) + "</td><td>" + percent(result.equityCost, 2) + "</td><td>" + percent(result.contributions.equity, 2) + "</td></tr>",
      "<tr><td>Preferred</td><td>" + money(values.preferredValue) + "</td><td>" + percent(result.weights.preferred * 100, 1) + "</td><td>" + percent(result.preferredCost, 2) + "</td><td>" + percent(result.contributions.preferred, 2) + "</td></tr>",
      "</tbody></table></div>"
    ].join("");
    lastResult = result;
    return [
      resultHeader("Weighted average cost of capital", percent(result.wacc, 2), "Market-value weights", result.totalCapital <= 0 ? "danger" : ""),
      "<div class=\"metrics-grid\">",
      metric("After-tax debt cost", percent(result.afterTaxDebt, 2), ""),
      metric("CAPM equity cost", percent(result.equityCost, 2), ""),
      metric("Total capital modeled", money(result.totalCapital), ""),
      "</div>",
      "<div class=\"details-section\">",
      sectionHeading("Capital mix", "Weight / WACC contribution"),
      "<div class=\"component-list\">",
      componentRow("Debt", result.weights.debt, result.afterTaxDebt, result.contributions.debt),
      componentRow("Equity", result.weights.equity, result.equityCost, result.contributions.equity),
      componentRow("Preferred", result.weights.preferred, result.preferredCost, result.contributions.preferred),
      "</div>",
      "</div>",
      "<div class=\"scenario-section\">",
      sectionHeading("Beta sensitivity", "WACC"),
      scenarioGrid([
        { name: "Lower beta", value: percent(lowBeta.wacc, 2), assumption: "beta " + Number(Math.max(0, Number(values.beta) - 0.2)).toFixed(2) },
        { name: "Base beta", value: percent(result.wacc, 2), assumption: "beta " + Number(values.beta).toFixed(2) },
        { name: "Higher beta", value: percent(highBeta.wacc, 2), assumption: "beta " + Number(Number(values.beta) + 0.2).toFixed(2) }
      ]),
      "</div>",
      "<div class=\"details-section\">",
      sectionHeading("Component audit", ""),
      table,
      formulaBox("WACC", "Wd * Kd * (1 - tax) + We * Ke + Wp * Kp", "CAPM equity cost Ke = risk-free rate + beta * market risk premium."),
      "</div>"
    ].join("");
  }

  function renderCagrResults(values) {
    var result = Engine.cagr(values);
    var status = result.valid ? (result.cagr >= 0 ? "Positive growth" : "Value declined") : "Check inputs";
    var tone = !result.valid || result.cagr < 0 ? "danger" : "";
    var doubling = result.valid && result.cagr > 0 ? 72 / result.cagr : null;
    lastResult = result;
    return [
      resultHeader("Compound annual growth rate", result.valid ? percent(result.cagr, 2) : "N/A", status, tone),
      "<div class=\"metrics-grid\">",
      metric("Total return", result.totalReturn === null ? "N/A" : percent(result.totalReturn, 1), result.totalReturn !== null && result.totalReturn >= 0 ? "positive" : "negative"),
      metric("Absolute gain", money(result.absoluteGain), result.absoluteGain >= 0 ? "positive" : "negative"),
      metric("Rule-of-72 doubling time", doubling === null ? "N/A" : doubling.toFixed(1) + " years", ""),
      "</div>",
      "<div class=\"chart-section\">",
      sectionHeading("Smoothed growth path", "CAGR illustration"),
      lineChart(result.rows, "balance", "initial", "Implied value", "Beginning value", "Smoothed value path implied by CAGR"),
      "</div>",
      "<div class=\"insight-section\">",
      sectionHeading("CAGR notes", ""),
      "<div class=\"insight-list\">",
      insight("Annualized result", result.valid ? "The value moved from " + money(values.initial) + " to " + money(values.finalValue) + " over " + values.years + " years." : "Beginning value and holding period must be greater than zero.", result.valid ? "" : "danger"),
      insight("Interpretation", "CAGR is a smoothed rate and does not represent the return earned in every individual year.", ""),
      "</div>",
      formulaBox("CAGR", "CAGR = (ending value / beginning value)^(1 / years) - 1", "Use XIRR instead when there are multiple or irregularly dated cash flows."),
      "</div>"
    ].join("");
  }

  function cashFlowChart(cashFlows) {
    var max = Math.max.apply(Math, cashFlows.map(function (flow) { return Math.abs(flow); }).concat([1]));
    var columns = cashFlows.map(function (flow, index) {
      var height = Math.max(2, Math.abs(flow) / max * 48);
      var style = flow >= 0
        ? "height:" + height + "%;bottom:50%"
        : "height:" + height + "%";
      return "<div class=\"bar-column\"><div class=\"bar-space\"><span class=\"bar-zero\"></span><span class=\"cash-bar" + (flow < 0 ? " negative" : "") + "\" style=\"" + style + "\" title=\"" + escapeHtml(money(flow)) + "\"></span></div><span class=\"bar-label\">" + (index === 0 ? "Now" : "Y" + index) + "</span></div>";
    }).join("");
    return "<div class=\"bar-chart\" role=\"img\" aria-label=\"Positive and negative project cash flows by year\">" + columns + "</div>";
  }

  function projectTable(result) {
    var cumulativeDiscounted = 0;
    var rows = result.cashFlows.map(function (flow, index) {
      var presentValue = flow / Math.pow(1 + Number(state.data.project.discountRate) / 100, index);
      cumulativeDiscounted += presentValue;
      return "<tr><td>" + (index === 0 ? "Today" : "Year " + index) + "</td><td>" + money(flow) + "</td><td>" + money(presentValue) + "</td><td>" + money(result.cumulative[index]) + "</td><td>" + money(cumulativeDiscounted) + "</td></tr>";
    }).join("");
    return "<div class=\"table-wrap\"><table class=\"data-table\"><caption>Project cash-flow analysis</caption><thead><tr><th>Period</th><th>Cash flow</th><th>Present value</th><th>Cumulative</th><th>Discounted cumulative</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function periodLabel(value) {
    if (value === null || !Number.isFinite(value)) {
      return "Not reached";
    }
    return value.toFixed(1) + (Math.abs(value - 1) < 0.05 ? " year" : " years");
  }

  function renderProjectResults(values) {
    var result = Engine.project(values);
    var accept = result.npv >= 0;
    var irrDisplay = result.irr === null ? "No unique IRR" : percent(result.irr, 2);
    var piDisplay = result.profitabilityIndex === null ? "N/A" : result.profitabilityIndex.toFixed(2) + "x";
    lastResult = result;
    return [
      resultHeader("Net present value", money(result.npv), accept ? "Value creating" : "Below required return", accept ? "" : "danger"),
      "<div class=\"metrics-grid\">",
      metric("Internal rate of return", irrDisplay, result.irr !== null && result.irr >= Number(values.discountRate) ? "positive" : "negative"),
      metric("Profitability index", piDisplay, result.profitabilityIndex !== null && result.profitabilityIndex >= 1 ? "positive" : ""),
      metric("Simple payback", periodLabel(result.payback), ""),
      "</div>",
      "<div class=\"chart-section\">",
      sectionHeading("Cash-flow profile", "Undiscounted"),
      cashFlowChart(result.cashFlows),
      "</div>",
      "<div class=\"insight-section\">",
      sectionHeading("Decision signals", ""),
      "<div class=\"insight-list\">",
      insight(accept ? "Positive NPV" : "Negative NPV", accept ? "The modeled project adds " + money(result.npv) + " above the required return." : "The modeled project falls short by " + money(Math.abs(result.npv)) + " at the entered hurdle rate.", accept ? "" : "danger"),
      insight("Discounted payback", result.discountedPayback === null ? "Discounted cash flows do not recover the initial outlay within the modeled period." : "Discounted payback occurs after approximately " + periodLabel(result.discountedPayback) + ".", result.discountedPayback === null ? "warning" : ""),
      insight("IRR caveat", result.irr === null ? "These cash flows do not produce a single detected IRR." : "The first detected IRR is " + percent(result.irr, 2) + "; unusual sign changes can create multiple IRRs.", ""),
      "</div>",
      "</div>",
      "<div class=\"details-section\">",
      sectionHeading("Cash-flow audit", ""),
      projectTable(result),
      formulaBox("Net present value", "NPV = sum(cash flow(t) / (1 + required return)^t)", "A positive NPV indicates value above the entered required return."),
      "</div>"
    ].join("");
  }

  function healthColor(score) {
    if (score >= 65) {
      return "var(--brand)";
    }
    if (score >= 45) {
      return "var(--amber)";
    }
    return "var(--red)";
  }

  function renderHealthResults(values) {
    var result = Engine.moneyHealth(values);
    var balanceTone = result.balance >= 0 ? "positive" : "negative";
    var allocationParts = [
      { label: "Essentials", value: Number(values.essentials), display: money(values.essentials), color: "blue" },
      { label: "Lifestyle", value: Number(values.lifestyle), display: money(values.lifestyle), color: "amber" },
      { label: "Debt payments", value: Number(values.debtPayments), display: money(values.debtPayments), color: "red" },
      { label: "Saving", value: Number(values.monthlySavings), display: money(values.monthlySavings), color: "brand" }
    ];
    if (result.balance > 0) {
      allocationParts.push({ label: "Unallocated", value: result.balance, display: money(result.balance), color: "brand" });
    }
    lastResult = result;
    return [
      "<div class=\"result-kicker\">Financial resilience score</div>",
      "<div class=\"gauge-wrap\">",
      "<div class=\"gauge\" style=\"--score:" + result.score + ";--gauge-color:" + healthColor(result.score) + "\"><div class=\"gauge-value\">" + result.score + "<span>/100</span></div></div>",
      "<div class=\"gauge-copy\"><strong>" + escapeHtml(result.status) + "</strong><span>Built from your savings rate, debt load, emergency reserves and monthly balance.</span></div>",
      "</div>",
      "<div class=\"metrics-grid\">",
      metric("Monthly balance", money(result.balance), balanceTone),
      metric("Savings rate", percent(result.savingsRate), result.savingsRate >= 20 ? "positive" : ""),
      metric("Debt-to-income", percent(result.debtToIncome), result.debtToIncome > 36 ? "negative" : ""),
      "</div>",
      "<div class=\"details-section\">",
      sectionHeading("Monthly allocation", ""),
      stackedBar(allocationParts),
      "</div>",
      "<div class=\"insight-section\">",
      sectionHeading("Priority actions", ""),
      "<div class=\"insight-list\">",
      insight("Emergency runway", "Liquid reserves cover " + result.emergencyMonths.toFixed(1) + " months of essentials and debt payments.", result.emergencyMonths < 3 ? "danger" : result.emergencyMonths < 6 ? "warning" : ""),
      insight("Six-month reserve", result.emergencyGap > 0 ? "Add about " + money(result.emergencyGap) + " to reach a six-month reserve." : "Your liquid savings meet the modeled six-month reserve.", result.emergencyGap > 0 ? "warning" : ""),
      insight("Debt horizon", result.debtPayoffMonths === null ? "You entered debt outstanding but no monthly debt payment." : result.debtPayoffMonths === 0 ? "No debt is currently entered." : "At the current payment pace, total debt equals about " + duration(result.debtPayoffMonths) + " of payments before interest.", result.debtPayoffMonths === null ? "danger" : result.debtPayoffMonths > 60 ? "warning" : ""),
      insight("Cash-flow check", result.balance >= 0 ? money(result.balance) + " remains after planned spending and saving each month." : "Planned outflow exceeds take-home income by " + money(Math.abs(result.balance)) + " per month.", result.balance >= 0 ? "" : "danger"),
      "</div>",
      formulaBox("Score composition", "30% savings + 25% debt load + 25% reserves + 20% monthly balance", "Each component is capped; this is a planning score, not a lending or credit score."),
      "</div>"
    ].join("");
  }

  function calculateActive(tool, values) {
    var renderers = {
      sip: renderSipResults,
      stepup: renderSipResults,
      lumpsum: renderLumpsumResults,
      loan: renderLoanResults,
      goal: renderGoalResults,
      retirement: renderRetirementResults,
      nps: renderNpsResults,
      deposit: renderDepositResults,
      rd: renderRdResults,
      cagr: renderCagrResults,
      wacc: renderWaccResults,
      project: renderProjectResults,
      health: renderHealthResults
    };
    return renderers[tool.id](values);
  }

  function renderResultsPane(tool, values) {
    return [
      "<section class=\"results-pane\" aria-labelledby=\"resultsHeading\">",
      "<div class=\"pane-heading\">",
      "<div><h2 id=\"resultsHeading\">Projection</h2><p>Based on the assumptions shown.</p></div>",
      "</div>",
      "<div id=\"resultsContent\" aria-live=\"polite\">",
      calculateActive(tool, values),
      "</div>",
      "</section>"
    ].join("");
  }

  function updateResults() {
    var tool = TOOLS[state.activeTool];
    var container = document.getElementById("resultsContent");
    if (!tool || !container) {
      return;
    }
    container.innerHTML = calculateActive(tool, state.data[tool.id]);
  }

  function fieldDefinition(tool, key) {
    var found = null;
    tool.sections.some(function (section) {
      return section.fields.some(function (item) {
        if (item.key === key) {
          found = item;
          return true;
        }
        return false;
      });
    });
    return found;
  }

  function handleControlInput(event) {
    var target = event.target;
    var key = target.getAttribute("data-key");
    if (!key) {
      return;
    }
    var value = Number(target.value);
    if (!Number.isFinite(value)) {
      target.setAttribute("aria-invalid", "true");
      return;
    }
    var tool = TOOLS[state.activeTool];
    var definition = fieldDefinition(tool, key);
    if (definition) {
      var invalid = value < Number(definition.min) || value > Number(definition.max);
      target.setAttribute("aria-invalid", invalid ? "true" : "false");
    }
    state.data[state.activeTool][key] = value;

    document.querySelectorAll("[data-key=\"" + key + "\"]").forEach(function (control) {
      if (control === target) {
        return;
      }
      if (control.getAttribute("data-control") === "range" && definition) {
        control.value = Math.max(Number(definition.min), Math.min(Number(definition.max), value));
      } else {
        control.value = value;
      }
    });

    saveState();
    updateResults();
  }

  function handleCashFlowInput(event) {
    var index = event.target.getAttribute("data-cash-index");
    if (index === null) {
      return;
    }
    var value = Number(event.target.value);
    if (!Number.isFinite(value)) {
      event.target.setAttribute("aria-invalid", "true");
      return;
    }
    event.target.setAttribute("aria-invalid", "false");
    state.data.project.cashFlows[Number(index)] = value;
    saveState();
    updateResults();
  }

  function bindCalculatorEvents() {
    var form = document.getElementById("calculatorForm");
    if (!form) {
      return;
    }
    form.addEventListener("input", function (event) {
      if (event.target.hasAttribute("data-cash-index")) {
        handleCashFlowInput(event);
      } else {
        handleControlInput(event);
      }
    });
    form.addEventListener("change", function (event) {
      if (event.target.tagName === "SELECT") {
        handleControlInput(event);
      }
    });

    var addButton = document.getElementById("addCashFlow");
    if (addButton) {
      addButton.addEventListener("click", function (event) {
        event.preventDefault();
        state.data.project.cashFlows.push(0);
        saveState();
        renderCalculator();
        var inputs = document.querySelectorAll("[data-cash-index]");
        if (inputs.length) {
          inputs[inputs.length - 1].focus();
        }
      });
    }

    form.querySelectorAll("[data-remove-cash]").forEach(function (button) {
      button.addEventListener("click", function (event) {
        event.preventDefault();
        if (state.data.project.cashFlows.length <= 2) {
          return;
        }
        var index = Number(button.getAttribute("data-remove-cash"));
        state.data.project.cashFlows.splice(index, 1);
        saveState();
        renderCalculator();
      });
    });
  }

  function renderCalculator() {
    var tool = TOOLS[state.activeTool];
    if (!tool) {
      state.activeTool = "sip";
      tool = TOOLS.sip;
    }
    var values = state.data[tool.id];
    elements.group.textContent = groupLabel(tool.group);
    elements.title.textContent = tool.title;
    elements.description.textContent = tool.description;
    document.title = tool.title + " | FinScope";
    elements.view.setAttribute("role", "tabpanel");
    elements.view.setAttribute("aria-labelledby", "tab-" + tool.id);
    elements.view.innerHTML = renderInputPane(tool, values) + renderResultsPane(tool, values);
    renderNavigation();
    bindCalculatorEvents();
    saveState();
  }

  function selectTool(id, updateHash) {
    if (!TOOLS[id]) {
      return;
    }
    state.activeTool = id;
    if (updateHash && window.location.hash !== "#" + id) {
      window.history.pushState(null, "", "#" + id);
    }
    renderCalculator();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function showToast(message) {
    elements.toast.textContent = message;
    elements.toast.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      elements.toast.classList.remove("show");
    }, 2400);
  }

  function summaryLines() {
    var tool = TOOLS[state.activeTool];
    var result = lastResult;
    if (!result) {
      return ["FinScope", tool.title];
    }
    var lines = ["FinScope: " + tool.title, "Currency unit: " + state.currency];
    if (tool.id === "sip" || tool.id === "stepup") {
      lines.push("Expected maturity: " + money(result.ending));
      lines.push("Total contributed: " + money(result.contributed));
      lines.push("Value in today's money: " + money(result.realValue));
    } else if (tool.id === "lumpsum") {
      lines.push("Expected maturity: " + money(result.ending));
      lines.push("Amount invested: " + money(result.principal));
      lines.push("Estimated returns: " + money(result.gains));
    } else if (tool.id === "loan") {
      lines.push("Scheduled payment: " + money(result.monthlyPayment));
      lines.push("Payoff: " + duration(result.payoffMonths));
      lines.push("Interest saved: " + money(result.interestSaved));
    } else if (tool.id === "goal") {
      lines.push("Future goal: " + money(result.futureTarget));
      lines.push("Required monthly saving: " + money(result.requiredMonthly));
      lines.push("Current plan funding: " + percent(result.fundingPercent, 0));
    } else if (tool.id === "retirement") {
      lines.push("Target corpus: " + money(result.targetCorpus));
      lines.push("Projected corpus: " + money(result.projectedCorpus));
      lines.push("Funding level: " + percent(result.fundedPercent, 0));
    } else if (tool.id === "deposit") {
      lines.push("Net maturity: " + money(result.netMaturity));
      lines.push("Gross interest: " + money(result.grossInterest));
      lines.push("Real value: " + money(result.realValue));
    } else if (tool.id === "rd") {
      lines.push("RD maturity: " + money(result.maturity));
      lines.push("Total deposited: " + money(result.deposited));
      lines.push("Interest earned: " + money(result.interest));
    } else if (tool.id === "nps") {
      lines.push("NPS corpus: " + money(result.totalCorpus));
      lines.push("Estimated lump sum: " + money(result.lumpSum));
      lines.push("Estimated monthly pension: " + money(result.monthlyPension));
    } else if (tool.id === "cagr") {
      lines.push("CAGR: " + (result.cagr === null ? "N/A" : percent(result.cagr, 2)));
      lines.push("Total return: " + (result.totalReturn === null ? "N/A" : percent(result.totalReturn, 1)));
      lines.push("Absolute gain: " + money(result.absoluteGain));
    } else if (tool.id === "wacc") {
      lines.push("WACC: " + percent(result.wacc, 2));
      lines.push("After-tax debt cost: " + percent(result.afterTaxDebt, 2));
      lines.push("CAPM equity cost: " + percent(result.equityCost, 2));
    } else if (tool.id === "project") {
      lines.push("NPV: " + money(result.npv));
      lines.push("IRR: " + (result.irr === null ? "No unique IRR" : percent(result.irr, 2)));
      lines.push("Payback: " + periodLabel(result.payback));
    } else if (tool.id === "health") {
      lines.push("Money health score: " + result.score + "/100 (" + result.status + ")");
      lines.push("Savings rate: " + percent(result.savingsRate));
      lines.push("Debt-to-income: " + percent(result.debtToIncome));
    }
    lines.push("Educational estimate generated locally in FinScope.");
    return lines;
  }

  function copySummary() {
    var text = summaryLines().join("\n");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Summary copied");
      }).catch(function () {
        fallbackCopy(text);
      });
      return;
    }
    fallbackCopy(text);
  }

  function fallbackCopy(text) {
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand("copy");
      showToast("Summary copied");
    } catch (error) {
      showToast("Copy is not available in this browser");
    }
    textarea.remove();
  }

  function csvEscape(value) {
    var string = String(value === undefined || value === null ? "" : value);
    if (/[",\n]/.test(string)) {
      return "\"" + string.replace(/"/g, "\"\"") + "\"";
    }
    return string;
  }

  function csvForActiveTool() {
    var id = state.activeTool;
    var result = lastResult;
    var rows = [];
    if (id === "loan") {
      rows.push(["Month", "Opening balance", "Payment", "Principal", "Interest", "Ending balance"]);
      result.schedule.forEach(function (row) {
        rows.push([row.month, row.startingBalance, row.payment, row.principal, row.interest, row.endingBalance]);
      });
    } else if (id === "project") {
      rows.push(["Period", "Cash flow", "Cumulative"]);
      result.cashFlows.forEach(function (flow, index) {
        rows.push([index, flow, result.cumulative[index]]);
      });
    } else if (id === "wacc") {
      rows.push(["Source", "Weight", "Component cost percent", "WACC contribution percent"]);
      rows.push(["Debt", result.weights.debt, result.afterTaxDebt, result.contributions.debt]);
      rows.push(["Equity", result.weights.equity, result.equityCost, result.contributions.equity]);
      rows.push(["Preferred", result.weights.preferred, result.preferredCost, result.contributions.preferred]);
    } else if (id === "health") {
      rows.push(["Metric", "Value"]);
      rows.push(["Score", result.score]);
      rows.push(["Savings rate percent", result.savingsRate]);
      rows.push(["Debt-to-income percent", result.debtToIncome]);
      rows.push(["Emergency months", result.emergencyMonths]);
      rows.push(["Monthly balance", result.balance]);
    } else {
      rows.push(["Year", "Primary value", "Secondary value"]);
      var sourceRows = result.rows || [];
      sourceRows.forEach(function (row) {
        rows.push([
          row.year,
          row.balance !== undefined ? row.balance : row.ending,
          row.contributed !== undefined
            ? row.contributed
            : row.deposited !== undefined
              ? row.deposited
              : row.principal !== undefined
                ? row.principal
                : row.initial !== undefined
                  ? row.initial
                  : row.realValue
        ]);
      });
    }
    rows.unshift(["FinScope " + TOOLS[id].title, "Currency unit", state.currency]);
    return rows.map(function (row) {
      return row.map(csvEscape).join(",");
    }).join("\n");
  }

  function exportCsv() {
    if (!lastResult) {
      return;
    }
    var blob = new Blob([csvForActiveTool()], { type: "text/csv;charset=utf-8" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.download = "finscope-" + state.activeTool + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("CSV exported");
  }

  function resetCurrentTool() {
    state.data[state.activeTool] = defaultToolValues(TOOLS[state.activeTool]);
    saveState();
    renderCalculator();
    showToast(TOOLS[state.activeTool].title + " reset");
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme);
    elements.theme.setAttribute("aria-label", state.theme === "dark" ? "Use light theme" : "Use dark theme");
    document.querySelector("meta[name=\"theme-color\"]").setAttribute("content", state.theme === "dark" ? "#0b211a" : "#12382d");
  }

  function initialize() {
    var hashTool = window.location.hash.replace("#", "");
    if (TOOL_ORDER.indexOf(hashTool) !== -1) {
      state.activeTool = hashTool;
    }
    elements.currency.value = state.currency;
    applyTheme();
    renderCalculator();

    elements.toolNav.addEventListener("click", function (event) {
      var button = event.target.closest("[data-tool]");
      if (button) {
        selectTool(button.getAttribute("data-tool"), true);
      }
    });
    elements.toolNav.addEventListener("keydown", function (event) {
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft" && event.key !== "Home" && event.key !== "End") {
        return;
      }
      event.preventDefault();
      var current = TOOL_ORDER.indexOf(state.activeTool);
      var next = current;
      if (event.key === "ArrowRight") {
        next = (current + 1) % TOOL_ORDER.length;
      } else if (event.key === "ArrowLeft") {
        next = (current - 1 + TOOL_ORDER.length) % TOOL_ORDER.length;
      } else if (event.key === "Home") {
        next = 0;
      } else if (event.key === "End") {
        next = TOOL_ORDER.length - 1;
      }
      selectTool(TOOL_ORDER[next], true);
      var selected = elements.toolNav.querySelector("[data-tool=\"" + TOOL_ORDER[next] + "\"]");
      if (selected) {
        selected.focus();
      }
    });

    elements.currency.addEventListener("change", function () {
      state.currency = elements.currency.value;
      saveState();
      renderCalculator();
      showToast("Display unit changed to " + state.currency);
    });

    elements.theme.addEventListener("click", function () {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
      saveState();
    });

    elements.reset.addEventListener("click", resetCurrentTool);
    elements.copy.addEventListener("click", copySummary);
    elements.export.addEventListener("click", exportCsv);
    elements.print.addEventListener("click", function () { window.print(); });

    window.addEventListener("hashchange", function () {
      var id = window.location.hash.replace("#", "");
      if (TOOL_ORDER.indexOf(id) !== -1 && id !== state.activeTool) {
        selectTool(id, false);
      }
    });
  }

  initialize();
}());

  </script>
</body>
</html>
